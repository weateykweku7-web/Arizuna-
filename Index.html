<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arizuna Ghana Shop</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">
<style>
body{font-family:sans-serif;margin:0;background:#f7f7f7}
header{background:#000;color:#fff;padding:15px;text-align:center;position:sticky;top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 6px #0001}
.card img{width:100%;border-radius:10px;height:130px;object-fit:cover}
.price{color:#0a7;font-weight:bold;margin:5px 0}
button{background:#000;color:#fff;border:0;padding:8px 12px;border-radius:8px;width:100%}
#cart{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px;border-top:2px solid #000;display:none}
</style>
</head>
<body>
<header>
<h2 style="margin:0">ARIZUNA GHANA</h2>
<small>Quality Products - Pay on Delivery</small>
</header>

<div class="grid">
<div class="card">
<img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
<h4>Classic Sneakers</h4>
<div class="price">GHS 250</div>
<button onclick="add('Classic Sneakers - GHS 250')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400">
<h4>Nike Running Shoe</h4>
<div class="price">GHS 350</div>
<button onclick="add('Nike Running Shoe - GHS 350')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400">
<h4>Leather Handbag</h4>
<div class="price">GHS 180</div>
<button onclick="add('Leather Handbag - GHS 180')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400">
<h4>Smart Watch</h4>
<div class="price">GHS 220</div>
<button onclick="add('Smart Watch - GHS 220')">Add to Cart</button>
</div>
</div>

<div id="cart">
<strong id="count">0 items</strong>
<div id="list" style="font-size:13px;margin:6px 0"></div>
<button onclick="order()" style="background:#25D366">Order on WhatsApp</button>
</div>

<script>
let items=[];
function add(p){
 items.push(p);
 document.getElementById('cart').style.display='block';
 document.getElementById('count').innerText=items.length+' items in cart';
 document.getElementById('list').innerText=items.join(', ');
}
function order(){
 let msg='Hello Arizuna! I want to order:%0A'+items.join('%0A');
 let phone='233553688108'; // CHANGE TO YOUR WHATSAPP NUMBER
 window.open('https://wa.me/'+phone+'?text='+msg);
}
</script>
</body>
</html>

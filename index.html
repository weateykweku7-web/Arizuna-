<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arizuna Ghana</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f7f7f8;padding-bottom:80px}header{background:#fff;padding:10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;box-shadow:0 2px 8px #0001}header img{width:48px;height:48px;border-radius:8px;background:#006b3f}.greet{background:linear-gradient(135deg,#006b3f,#00a85a);color:#fff;padding:12px;text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 6px #0001;text-align:center;padding-bottom:8px}.card .img{width:100%;height:105px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px}.price{color:#006b3f;font-weight:bold;margin:4px 0}.card button{background:#000;color:#fff;border:0;padding:7px;border-radius:8px;width:90%;margin-top:4px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0}.bottom-nav button{border:0;background:none;font-size:10px;color:#777;display:flex;flex-direction:column;align-items:center;gap:2px}.bottom-nav button.active{color:#006b3f;font-weight:bold}.bottom-nav i{font-size:18px}#cartView,#adminPanel{display:none;padding:12px}input{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}.btn{background:#006b3f;color:#fff;border:0;padding:11px;border-radius:8px;width:100%;font-weight:bold}.cart-item{background:#fff;padding:10px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between}</style></head><body>
<header><img src="./logo.png"><div><h1 style="margin:0;font-size:15px">ARIZUNA GHANA</h1><small style="font-size:10px;color:#666">Ghana's Trusted Marketplace</small></div></header>
<div class="greet"><h2 id="greetText" style="margin:0;font-size:15px">Hello👋, Welcome to Arizuna Ghana! 🇬🇭</h2><p style="margin:4px 0 0;font-size:11px">Pay on Delivery • Accra • Admin Approved ✅</p></div>
<div id="homeView"><div style="padding:8px;display:flex;gap:6px"><button onclick="filterCat('all')" class="btn" style="width:auto;padding:5px 10px;font-size:11px">All</button><button onclick="filterCat('shoes')" style="width:auto;padding:5px 10px;background:#fff;color:#006b3f;border:1px solid #006b3f">Shoes</button><button onclick="filterCat('bags')" style="width:auto;padding:5px 10px;background:#fff;color:#006b3f;border:1px solid #006b3f">Bags</button><button onclick="filterCat('watch')" style="width:auto;padding:5px 10px;background:#fff;color:#006b3f;border:1px solid #006b3f">Watch</button></div><div id="productGrid" class="grid"></div></div>
<div id="cartView"><h3>Cart (<span id="cartCount">0</span>)</h3><div id="cartList"></div><button class="btn" style="background:#25D366;margin-top:12px" onclick="orderWA()">Order on WhatsApp</button><button class="btn" style="background:#eee;color:#333;margin-top:8px" onclick="showView('home')">Continue Shopping</button></div>
<div id="adminPanel"><h3>Admin</h3><div id="loginBox"><input id="adminPass" type="password" placeholder="arizuna123"><button class="btn" onclick="login()">Login</button></div><div id="adminContent" style="display:none"><button class="btn" style="background:#c00" onclick="logout()">Logout</button><h4>Add Product</h4><input id="pName" placeholder="Name"><input id="pPrice" type="number" placeholder="Price"><input id="pCat" placeholder="shoes/bags/watch"><button class="btn" onclick="addProd()">Add</button><h4>Pending (<span id="pendCount">0</span>)</h4><div id="pendList"></div></div></div>
<nav class="bottom-nav"><button id="b-home" class="active" onclick="showView('home')"><i class="fa fa-home"></i>Home</button><button onclick="alert('Search coming soon')"><i class="fa fa-search"></i>Search</button><button id="b-cart" onclick="showView('cart')"><i class="fa fa-shopping-cart"></i>Cart <span id="navCart"></span></button><button id="b-admin" onclick="showView('admin')"><i class="fa fa-user-shield"></i>Admin</button></nav>
<script>
let h=new Date().getHours();let gt=h<12?'Good Morning':h<18?'Good Afternoon':'Good Evening';document.getElementById('greetText').innerText=gt+', Welcome to Arizuna Ghana! 🇬🇭';
let products=[{name:'Sneakers',price:250,cat:'shoes',color:'#006b3f',icon:'👟',approved:true},{name:'Handbag',price:180,cat:'bags',color:'#d4a017',icon:'👜',approved:true},{name:'Watch',price:220,cat:'watch',color:'#222',icon:'⌚',approved:true},{name:'Backpack',price:150,cat:'bags',color:'#ce1126',icon:'🎒',approved:true}];
let cart=[];let curCat='all';let isAdmin=false;
function render(){let grid=document.getElementById('productGrid');grid.innerHTML='';let list=products.filter(p=>curCat==='all'||p.cat===curCat);list.forEach((p,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div class=img style="background:${p.color}">${p.icon}</div><b>${p.name}</b><div class=price>GHS ${p.price}</div><button onclick="addToCart(${i})">Add</button>`;grid.appendChild(d);});document.getElementById('cartCount').innerText=cart.length;document.getElementById('navCart').innerText=cart.length?'('+cart.length+')':'';}
function filterCat(c){curCat=c;render();showView('home');}
function showView(v){document.getElementById('homeView').style.display=v==='home'?'block':'none';document.getElementById('cartView').style.display=v==='cart'?'block':'none';document.getElementById('adminPanel').style.display=v==='admin'?'block':'none';document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));if(v==='home')document.getElementById('b-home').classList.add('active');if(v==='cart')document.getElementById('b-cart').classList.add('active');if(v==='admin')document.getElementById('b-admin').classList.add('active');}
function addToCart(i){cart.push(products[i]);render();renderCart();alert(products[i].name+' added!');}
function renderCart(){let l=document.getElementById('cartList');l.innerHTML='';if(cart.length===0){l.innerHTML='<p>Cart empty</p>';return;}cart.forEach((p,i)=>{let d=document.createElement('div');d.className='cart-item';d.innerHTML=`<span>${p.name} - GHS ${p.price}</span><button onclick="cart.splice(${i},1);render();renderCart()">X</button>`;l.appendChild(d);});}
function orderWA(){if(cart.length===0)return alert('Cart empty');let m='Hello Arizuna! I want '+cart.map(c=>c.name).join(', ');window.open('https://wa.me/233553688108?text='+m,'_blank');}
function login(){if(document.getElementById('adminPass').value==='arizuna123'){isAdmin=true;document.getElementById('loginBox').style.display='none';document.getElementById('adminContent').style.display='block';}else alert('Wrong');}
function logout(){isAdmin=false;document.getElementById('loginBox').style.display='block';document.getElementById('adminContent').style.display='none';}
function addProd(){let n=document.getElementById('pName').value,pr=document.getElementById('pPrice').value;if(!n)return;products.push({name:n,price:pr,cat:'shoes',color:'#006b3f',icon:'📦'});render();}
render();
</script></body></html>
